[project]
name = "my-django-site"
version = "0.1.0"
description = "A small blog built with Django."
requires-python = ">=3.10"

[tool.ruff]
line-length = 99
target-version = "py310"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]

[tool.ruff.format]
quote-style = "double"
